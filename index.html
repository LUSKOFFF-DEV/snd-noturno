document.addEventListener('input',e=>{let el=e.target,d=el.dataset,s=shift();if(d.field){let t=s.tasks.find(x=>x.id===d.id);t[d.field]=el.value;save()}else if(el.id==='technician'){s.technician=el.value;save()}else if(d.extnote!==undefined){s.external[+d.extnote].note=el.value;save()}else if(el.id==='receiveFrom'||el.id==='receiveNote'){s.receiving[el.id==='receiveFrom'?'from':'note']=el.value;s.receiving.confirmed=null;save()}else if(d.receivenote!==undefined){let v=s.receiving;v.items[d.receivenote]??={status:'Não conferido',note:''};v.items[d.receivenote].note=el.value;v.confirmed=null;save()}else if(d.presencenote!==undefined){let a=s.attendance[d.presencenote]??={status:'A confirmar',events:[]};a.note=el.value;save()}});function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))}function validTask(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time)&& (t.time>='19:00'||t.time<='07:00')&&['normal','alta','critica'].includes(t.priority)&&['Rotina','Auditoria'].includes(t.category)&&typeof t.desc==='string'&&typeof t.role==='string'}function validStaff(a){return Array.isArray(a)&&a.length===roles.length&&a.every((x,i)=>x&&x.id==='role-'+i&&x.role===roles[i]&&typeof x.names==='string')}function validBackup(x){return x?.version===1&&Array.isArray(x.catalog)&&x.catalog.every(t=>validTask(t)&&typeof t.active==='boolean')&&validStaff(x.staffTemplate)&&['dark','light'].includes(x.theme)&&x.shifts&&typeof x.shifts==='object'&&Object.entries(x.shifts).every(([d,s])=>validDate(d)&&s.date===d&&Array.isArray(s.tasks)&&s.tasks.every(t=>validTask(t)&&Object.hasOwn(statusLabel,t.status)&&typeof t.note==='string'&&typeof t.executor==='string'&&(t.completed===null||!isNaN(Date.parse(t.completed)))&&Array.isArray(t.events)&&t.events.every(e=>typeof e.text==='string'&&!isNaN(Date.parse(e.at))))&&validStaff(s.staff)&&Array.isArray(s.external)&&s.external.length===2&&s.external.every(e=>typeof e.title==='string'&&typeof e.note==='string'&&['A confirmar','Confirmada','Repassada ao dia'].includes(e.status)&&(e.at===null||!isNaN(Date.parse(e.at))))&&Array.isArray(s.staffEvents)&&s.staffEvents.every(e=>typeof e.text==='string'&&!isNaN(Date.parse(e.at)))&&typeof s.technician==='string')}
document.addEventListener('change',async e=>{let el=e.target,d=el.dataset,s=shift();if(el.id==='date'&&validDate(el.value)){selected=el.value;render()}else if(d.receive!==undefined){let v=s.receiving,i=d.receive;v.items[i]??={note:''};v.items[i].status=el.value;v.confirmed=null;v.events.push({at:now(),text:receiveItems[i]+': '+el.value});save();if(el.value==='Com divergência'){let details=el.closest('section')?.querySelector('details');if(details)details.open=true}}else if(d.presence!==undefined){let a=s.attendance[d.presence]??={events:[]};a.status=el.value;a.at=now();a.events.push({at:a.at,text:d.presence.split('|').slice(2).join('|')+': '+a.status});save();render()}else if(d.staff!==undefined){let x=s.staff[+d.staff];if(x.names!==el.value){s.staffEvents.push({at:now(),text:x.role+': '+(x.names||'—')+' → '+el.value});x.names=el.value;save()}}else if(d.external!==undefined){let x=s.external[+d.external];x.status=el.value;x.at=now();save();render()}else if(el.id==='file'&&el.files[0]){try{let x=JSON.parse(await el.files[0].text());if(d.mode==='importStaff'){if(!validStaff(x.staff))throw Error('Escala inválida');if(!validDate(x.date))throw Error('Data inválida');if(!confirm('Salvar esta escala como modelo fixo e aplicar ao plantão selecionado ('+dateLabel(selected)+')? Os outros plantões serão preservados.'))return;let dest=shift();dest.staff=clone(x.staff);dest.staffEvents.push({at:now(),text:'Escala de referência importada como modelo fixo'});db.staffTemplate=clone(x.staff);tab='equipe'}else{if(!validBackup(x))throw Error('Backup inválido');if(!confirm('Substituir todos os registros locais pelo backup?'))return;db=x}save();render()}catch(err){alert('Importação não realizada: '+err.message)}finally{el.value=''}}});document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(!x.title.trim()||!(x.time>='19:00'||x.time<='07:00')){alert('Informe título e horário entre 19h e 07h.');return
