<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b24"><title>SND Noturno</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2934;--line:#344552;--fg:#edf5f8;--muted:#a6bac6;--accent:#63ddc2;--amber:#ffca72;--red:#ff8b91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}body.light{color-scheme:light;--bg:#edf3f5;--panel:#fff;--line:#c6d3db;--fg:#142632;--muted:#526674;--accent:#006b58;--amber:#875000;--red:#b52130}main,header>div,nav{max-width:760px;margin:auto}main{padding:16px 16px 110px}header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}h1,h2,h3,p{margin:0 0 10px}h1{font-size:21px}h2{font-size:20px}h3{font-size:17px}small,.muted{color:var(--muted)}button,input,select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:46px}button{cursor:pointer;font-weight:650}button.primary{background:var(--accent);color:#102720;border:0}body.light button.primary{color:white}button.active{border:2px solid var(--accent);color:var(--accent)}input,textarea,select{width:100%;min-width:0}textarea{resize:vertical}label{display:block;margin:8px 0;color:var(--muted);font-size:14px}label input,label select,label textarea{display:block;margin-top:4px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.row>*{min-width:0}.grow{flex:1}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.task{border-left:4px solid var(--line)}.late{border-color:var(--red)}.soon{border-color:var(--amber)}.done{border-color:var(--accent)}.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--accent)}.tag{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 9px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.buttons button{font-size:13px;padding:8px 4px}.filters{display:flex;overflow:auto;gap:6px;padding:5px 0}.filters button{white-space:nowrap;font-size:13px}.bar{height:8px;background:var(--line);border-radius:10px;overflow:hidden}.bar div{height:100%;background:var(--accent)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:6}nav button{flex:1;border:0;background:transparent;font-size:11px;padding:5px 2px;min-height:54px}nav span{display:block;font-size:19px}#critical{font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:8px}#notice{font-size:13px;color:var(--amber)}.print{display:none}details{margin-top:10px}summary{cursor:pointer;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;vertical-align:top;text-align:left} @media print{@page{size:A4;margin:12mm}body{background:white!important;color:black!important;font:10pt Arial}header,nav,main{display:none!important}.print{display:block!important}.print h1{font-size:17pt}.print h2{font-size:13pt;margin-top:16px}tr{break-inside:avoid}thead{display:table-header-group}pre{font-size:9pt}}
</style></head><body><header><div><div class="row between"><div><h1>◐ SND Noturno</h1><small>Gestão operacional • 19h–07h</small></div><button id="theme" aria-label="Alternar tema">☀</button></div><div id="critical" aria-live="polite"></div><div id="notice" role="alert"></div></div></header><main id="app"></main><nav id="nav"></nav><section class="print" id="print"></section><script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), clone=o=>JSON.parse(JSON.stringify(o)), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), now=()=>new Date().toISOString();
const fmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'medium'}), parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'});function currentShift(){let p=Object.fromEntries(parts.formatToParts(new Date()).map(x=>[x.type,x.value]));let d=new Date(`${p.year}-${p.month}-${p.day}T12:00:00Z`);if(+p.hour<7)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}function deadline(date,t){let d=new Date(date+'T'+t+':00-03:00');if(t<'19:00')d.setUTCDate(d.getUTCDate()+1);return d.getTime()}const dateLabel=d=>d.split('-').reverse().join('/'), parity=d=>+d.slice(-2)%2?'ÍMPAR':'PAR', stamp=s=>s?fmt.format(new Date(s)):'—';
const tasks=[['start','19:00','Recebimento do plantão','normal','Rotina','Conferências iniciais e escala.','Técnico'],['ceia','20:30','Ceia','critica','Rotina','Conferir, corrigir e garantir subida.','Técnico'],['lounge','21:00','Jantar médicos — Lounge','critica','Rotina','Montar e subir.','Equipe'],['estar','21:00','Jantar médicos — Estar Médico','critica','Rotina','Colocar no carrinho e subir.','Estar Médico — montagem'],['inicio','01:00','Início do desjejum','alta','Rotina','Conferir descida do carrinho, bandejas e louças.','Copeiras'],['cover','02:00','Cobertura das liberações','alta','Rotina','Confirmar cobertura pelas copeiras durante descanso do Avião.','Copeiras'],['return','03:00','Retorno do Avião','alta','Rotina','Confirmar retorno às liberações.','Avião'],['final','06:00','Finalização do desjejum — nível 1','critica','Auditoria','Montagem 100% pronta e correção pelo técnico noturno.','Técnico'],['saida','06:30','Saída do desjejum','critica','Rotina','Início da saída das bandejas/carrinhos, conforme liberação institucional.','Equipe'],['validade','07:00','Etiquetas de validade','alta','Auditoria','Conferir todos os produtos abertos.','Técnico'],['areas','07:00','Organização do setor','alta','Auditoria','Conferir ambiente, bancadas e carrinhos.','Toda a equipe'],['caixas','07:00','Caixas de insumos','alta','Auditoria','Conferir organização das caixas.','Avião'],['higiene','07:00','Conferência da higienização','alta','Auditoria','Verificar rotina de higienização.','ASG'],['retirada','07:00','Estar Médico — retirada e organização','normal','Rotina','Retirar a janta e organizar a copa; horário específico a confirmar.','Estar Médico — retirada'],['handover','07:00','Passagem de plantão','normal','Rotina','Comunicar pendências e ocorrências.','Técnico']].map(([id,time,title,priority,category,desc,role])=>({id,time,title,priority,category,desc,role,active:true}));
const roles=['Técnico','TASY','ADM','Lactário','HCBR — Hospital do Coração','Clínica Médica','UCCA','TMO / Oncologia','Maternidade','UTI Ped / Day Clinic','CM — Cirúrgica Médica','CIR — Cirúrgica','Estar Médico — montagem','Estar Médico — retirada','Avião','Auxiliar','ASG'];
// Names are imported separately, never embedded in the public deployment.
const blankStaff=()=>roles.map((role,i)=>({id:'role-'+i,role,names:''}));const initial=()=>({version:1,catalog:clone(tasks),shifts:{},theme:'dark',staffTemplate:blankStaff()});let db;try{db=JSON.parse(localStorage.getItem('snd-noturno-v1'))||initial()}catch(e){db=initial();$('notice').textContent='Não foi possível ler o histórico local. Importe um backup antes de continuar.'}let selected=currentShift(),tab='plantao',filter='Todos';const hasModel=()=>db.staffTemplate.some(x=>x.names.trim());function save(){try{localStorage.setItem('snd-noturno-v1',JSON.stringify(db));$('notice').textContent='';return true}catch(e){$('notice').textContent='Falha ao salvar! Exporte um backup agora.';return false}}function shift(){if(!db.shifts[selected]){db.shifts[selected]={date:selected,tasks:db.catalog.filter(t=>t.active).map(t=>({...clone(t),status:'todo',note:'',completed:null,executor:'',events:[]})),staff:clone(db.staffTemplate),external:[{title:'Nível 2 — Nutricionista do dia',status:'A confirmar',note:'',at:null},{title:'Nível 3 — Nutricionista cliente',status:'A confirmar',note:'',at:null}],staffEvents:[],technician:''};save()}return db.shifts[selected]}const statusLabel={todo:'A fazer',pending:'Pendente / intercorrência',done:'Concluído'}, priorityLabel={normal:'Normal',alta:'Alta',critica:'Crítica'};const sorted=s=>[...s.tasks].sort((a,b)=>deadline(s.date,a.time)-deadline(s.date,b.time));function timeState(t){if(t.status==='done')return 'done';let m=(deadline(selected,t.time)-Date.now())/60000;return m<0?'late':m<=30?'soon':''}function updateCritical(){let s=shift(),a=sorted(s).filter(t=>t.priority==='critica'&&t.status!=='done'),t=a[0];if(!t){$('critical').innerHTML='<span class="green">✓ Nenhuma trava crítica em aberto</span>';return}let diff=deadline(selected,t.time)-Date.now(),m=Math.floor(Math.abs(diff)/60000),sec=Math.floor(Math.abs(diff)/1000)%60; $('critical').innerHTML=`<strong class="${diff<0?'red':diff<=1800000?'amber':''}">${diff<0?'ATRASADA':'PRÓXIMA TRAVA'} • ${esc(t.time)} ${esc(t.title)}</strong><br>${diff<0?'Atraso':'Faltam'} ${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s${a.filter(x=>deadline(selected,x.time)<Date.now()).length?' • '+a.filter(x=>deadline(selected,x.time)<Date.now()).length+' crítica(s) vencida(s)':''}`;document.querySelectorAll('[data-task]').forEach(el=>{let x=s.tasks.find(y=>y.id===el.dataset.task);if(x)el.className='card task '+timeState(x)})}
function taskCard(t){let names=shift().staff.find(x=>x.role===t.role)?.names;return `<article class="card task ${timeState(t)}" data-task="${esc(t.id)}"><div class="row between"><strong>${esc(t.time)}</strong><span class="tag">${priorityLabel[t.priority]} • ${esc(t.category)}</span></div><h3>${esc(t.title)}</h3><p class="muted">${esc(t.desc)}</p><small>Responsável: ${esc(t.role)}${names?' • '+esc(names):''}</small><p class="${t.status==='done'?'green':t.status==='pending'?'amber':''}">${statusLabel[t.status]} ${t.completed?' • '+stamp(t.completed)+(new Date(t.completed).getTime()>deadline(selected,t.time)?' • conclusão tardia':''):''}</p><div class="buttons">${['todo','pending','done'].map((x,i)=>`<button class="${t.status===x?'active':''}" data-action="status" data-id="${esc(t.id)}" data-value="${x}">${['A fazer','Intercorrência','Concluir'][i]}</button>`).join('')}</div><label>Observações<textarea data-field="note" data-id="${esc(t.id)}" rows="2" placeholder="Sem dados de pacientes">${esc(t.note)}</textarea></label><label>Executor real (opcional)<input data-field="executor" data-id="${esc(t.id)}" value="${esc(t.executor)}"></label>${t.events.length?`<details><summary>Histórico • ${t.events.length} evento(s)</summary>${t.events.map(e=>`<p><small>${stamp(e.at)}</small><br>${esc(e.text)}</p>`).join('')}</details>`:''}</article>`}
function report(s){let done=s.tasks.filter(t=>t.status==='done').length, pending=s.tasks.filter(t=>t.status==='pending').length, lateCount=s.tasks.filter(t=>t.completed&&Date.parse(t.completed)>deadline(s.date,t.time)).length;let lines=[`SND NOTURNO — ${dateLabel(s.date)} — Plantão ${parity(s.date)}`,`Técnico: ${s.technician||'Não informado'}`,`Concluídas: ${done}/${s.tasks.length} | Pendentes: ${pending} | A fazer: ${s.tasks.length-done-pending} | Conclusões tardias: ${lateCount}`,''];for(let t of sorted(s)){let late=t.completed&&new Date(t.completed).getTime()>deadline(s.date,t.time);if(t.status!=='done'||late||t.events.some(e=>e.kind==='pending'))lines.push(`${t.time} | ${t.title} | ${statusLabel[t.status]}${late?' (tardia)':''}${t.completed?' | '+stamp(t.completed):''}${t.note?' | '+t.note:''}`, ...t.events.filter(e=>e.kind==='pending').map(e=>'  Intercorrência '+stamp(e.at)+': '+e.text))}lines.push('','Alterações de escala:',...(s.staffEvents.length?s.staffEvents.map(e=>stamp(e.at)+' — '+e.text):['Sem alterações registradas.']),'','Liberações externas:',...s.external.map(e=>e.title+': '+e.status+(e.note?' — '+e.note:'')+(e.at?' ('+stamp(e.at)+')':'')));return lines.join('\n')}
function staffText(s){return '🌝✨ Escala '+dateLabel(s.date)+'\n\n'+s.staff.map(x=>x.role+': '+(x.names||'A definir')).join('\n')}
function render(){let s=shift();document.body.classList.toggle('light',db.theme==='light');$('nav').innerHTML=[['plantao','◷','Plantão'],['equipe','♙','Equipe'],['auditoria','✓','Auditoria'],['passagem','▤','Passagem'],['historico','↶','Histórico'],['gestao','⚙','Gestão']].map(([k,i,n])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><span>${i}</span>${n}</button>`).join('');let h=`<div class="row between"><div><small>Data de início do plantão</small><strong class="green" style="display:block">${parity(selected)}</strong></div><div style="width:56%"><input aria-label="Data do plantão" type="date" id="date" value="${selected}"></div></div>`;
if(tab==='plantao'){let n=s.tasks.filter(t=>t.status==='done').length,p=s.tasks.filter(t=>t.status==='pending').length,percent=s.tasks.length?Math.round(n/s.tasks.length*100):0;h+=`<section class="card"><div class="row between"><h2>Meu plantão</h2><strong class="green">${percent}%</strong></div><div class="bar"><div style="width:${percent}%"></div></div><p style="margin-top:10px">${n} concluídas • ${p} pendentes • ${s.tasks.length-n-p} a fazer</p><label>Técnico responsável<input id="technician" value="${esc(s.technician)}"></label></section><div class="filters">${['Todos','A fazer','Pendentes','Concluídos','Auditoria'].map(f=>`<button data-filter="${f}" class="${filter===f?'active':''}">${f}</button>`).join('')}</div>`+sorted(s).filter(t=>filter==='Todos'||filter==='A fazer'&&t.status==='todo'||filter==='Pendentes'&&t.status==='pending'||filter==='Concluídos'&&t.status==='done'||filter==='Auditoria'&&t.category==='Auditoria').map(taskCard).join('');}
if(tab==='auditoria'){h+='<h2>Auditoria pré-passagem</h2><p class="muted">Conferências do técnico noturno. Nível 1 vinculado ao checklist.</p>'+sorted(s).filter(t=>t.category==='Auditoria').map(taskCard).join('')+'<h2>Liberações externas</h2><p class="muted">Não integram seu progresso. Registre somente confirmação efetivamente observada; respeite o protocolo institucional.</p>'+s.external.map((e,i)=>`<section class="card"><h3>${esc(e.title)}</h3><label>Situação<select data-external="${i}">${['A confirmar','Confirmada','Repassada ao dia'].map(v=>`<option ${e.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Observação<textarea data-extnote="${i}">${esc(e.note)}</textarea></label><small>${stamp(e.at)}</small></section>`).join('')}
if(tab==='equipe'){h+='<h2>Escala da equipe</h2><div class="card"><h3>'+(hasModel()?'Modelo fixo ativo':'Configuração inicial da escala')+'</h3><p class="muted">'+(hasModel()?'Novos plantões recebem o modelo automaticamente. Alterações abaixo valem apenas para esta data, salvo se você atualizar o modelo.':'Importe a escala nominal uma única vez neste aparelho. Não é necessário digitar os nomes.')+'</p><div class="row"><button class="primary" data-action="importStaff">Importar escala padrão</button><button data-action="applyTemplate">Carregar modelo neste plantão</button></div><input type="file" id="file" accept="application/json,.json" hidden></div><p class="muted">Edite os nomes conforme a distribuição do plantão.</p><div class="row"><button data-action="reuse">Copiar escala anterior</button><button data-action="template">Atualizar modelo fixo</button></div>'+s.staff.map((x,i)=>`<label>${esc(x.role)}<input data-staff="${i}" value="${esc(x.names)}" placeholder="A definir"></label>`).join('')+`<div class="row"><button data-action="copyStaff">Copiar escala</button></div><details><summary>Alterações de escala (${s.staffEvents.length})</summary>${s.staffEvents.map(e=>`<p>${stamp(e.at)} — ${esc(e.text)}</p>`).join('')}</details>`}
if(tab==='passagem'){h+=`<h2>Passagem de plantão</h2><div class="row"><button class="primary" data-action="copyReport">Copiar relatório</button><button data-action="print">Imprimir / PDF</button></div><div class="card"><pre>${esc(report(s))}</pre></div>`}
if(tab==='historico'){h+='<h2>Histórico de plantões</h2>'+Object.keys(db.shifts).sort().reverse().map(d=>{let x=db.shifts[d];return `<div class="card row between"><div><strong>${dateLabel(d)} • ${parity(d)}</strong><br><small>${x.tasks.filter(t=>t.status==='done').length}/${x.tasks.length} concluídas</small></div><button data-open="${d}">Abrir</button></div>`}).join('')}
if(tab==='gestao'){h+=`<h2>Gestão de tarefas</h2><p class="muted">Alterações no catálogo valem para novos plantões. O histórico preserva a versão original.</p><form id="taskForm" class="card"><input type="hidden" name="id"><label>Tarefa<input name="title" required></label><label>Horário<input type="time" name="time" required value="23:00"></label><label>Prioridade<select name="priority"><option value="normal">Normal</option><option value="alta">Alta</option><option value="critica">Crítica</option></select></label><label>Categoria<select name="category"><option>Rotina</option><option>Auditoria</option></select></label><label>Descrição<textarea name="desc"></textarea></label><label>Responsável<input name="role"></label><button class="primary">Salvar tarefa</button></form>`+db.catalog.map(t=>`<div class="card"><strong>${esc(t.time)} • ${esc(t.title)}</strong><p class="muted">${t.active?'Ativa':'Inativa'}</p><div class="row"><button data-edit="${esc(t.id)}">Editar</button><button data-toggle="${esc(t.id)}">${t.active?'Desativar':'Ativar'}</button></div></div>`).join('')+`<div class="card"><h2>Dados e segurança</h2><p>Dados locais neste navegador, sem sincronização. Não registre informações identificáveis de pacientes. Horários dependem do relógio do aparelho. Faça backup frequente.</p><div class="row"><button data-action="backup">Exportar backup</button><button data-action="import">Importar backup</button><button data-action="importStaff">Importar escala inicial</button></div><input type="file" id="file" accept="application/json,.json" hidden></div><div class="card"><h3>Módulos futuros</h3><p class="muted">Temperaturas • Mapas • Estoque • Indicadores</p></div>`} $('app').innerHTML=h;updateCritical()}
function download(name,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copy(text){try{await navigator.clipboard.writeText(text);alert('Copiado.')}catch{let a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();if(!ok)prompt('Copie o texto:',text)}}function printShift(){let s=shift();$('print').innerHTML=`<h1>SND Noturno — Registro operacional</h1><p>Plantão ${dateLabel(s.date)} (${parity(s.date)}) • 19h–07h • Técnico: ${esc(s.technician)}</p><table><thead><tr><th>Horário</th><th>Tarefa</th><th>Status</th><th>Conclusão real</th><th>Observações / executor</th><th>Visto</th></tr></thead><tbody>${sorted(s).map(t=>`<tr><td>${t.time}</td><td>${esc(t.title)}</td><td>${statusLabel[t.status]}</td><td>${stamp(t.completed)}</td><td>${esc(t.note)} ${esc(t.executor)} ${t.events.filter(e=>e.kind==='pending').map(e=>'<br>'+esc(stamp(e.at)+' '+e.text)).join('')}</td><td>_______</td></tr>`).join('')}</tbody></table><h2>Passagem</h2><pre>${esc(report(s))}</pre><h2>Escala</h2><table>${s.staff.map(x=>`<tr><td>${esc(x.role)}</td><td>${esc(x.names)}</td></tr>`).join('')}</table><p style="margin-top:30px">Técnico: _____________________ Recebimento: _____________________</p>`;window.print()}
$('theme').onclick=()=>{db.theme=db.theme==='dark'?'light':'dark';save();render()};document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset,s=shift();if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}if(d.filter){filter=d.filter;render();return}if(d.open){selected=d.open;tab='plantao';render();return}if(d.edit){let t=db.catalog.find(x=>x.id===d.edit),f=$('taskForm');for(let k of ['id','title','time','priority','category','desc','role'])f.elements[k].value=t[k];f.scrollIntoView();return}if(d.toggle){let t=db.catalog.find(x=>x.id===d.toggle);t.active=!t.active;save();render();return}switch(d.action){case 'status':{let t=s.tasks.find(x=>x.id===d.id),v=d.value;if(t.status===v)return;let reason='';if(v==='pending'){reason=prompt('Motivo obrigatório da intercorrência:',t.note);if(!reason?.trim())return;t.note=reason.trim()}if(t.status==='done'&&!confirm('Reabrir tarefa concluída? O registro anterior será mantido.'))return;t.events.push({at:now(),kind:v,text:v==='pending'?reason.trim():statusLabel[t.status]+' → '+statusLabel[v]+(t.note?' | '+t.note:'')});t.status=v;t.completed=v==='done'?now():null;save();render();break}case 'reuse':{let prev=Object.keys(db.shifts).filter(x=>x<selected).sort().pop();if(!prev){alert('Nenhum plantão anterior.');return}if(confirm('Substituir escala pela de '+dateLabel(prev)+'?')){s.staff=clone(db.shifts[prev].staff);s.staffEvents.push({at:now(),text:'Escala copiada de '+prev});save();render()}break}case 'applyTemplate':if(!hasModel()){alert('Importe a escala padrão primeiro.');break}if(confirm('Aplicar o modelo neste plantão? Os nomes desta data serão substituídos.')){s.staff=clone(db.staffTemplate);s.staffEvents.push({at:now(),text:'Modelo fixo aplicado ao plantão'});save();render()}break;case 'template':if(confirm('Usar esta escala como padrão dos próximos plantões? O histórico não será alterado.')){db.staffTemplate=clone(s.staff);save();render();alert('Modelo fixo atualizado.')}break;case 'copyStaff':copy(staffText(s));break;case 'copyReport':copy(report(s));break;case 'print':printShift();break;case 'backup':download('snd-backup-'+selected+'.json',db);break;case 'import':case 'importStaff':$('file').dataset.mode=d.action;$('file').click();break}});
document.addEventListener('input',e=>{let el=e.target,d=el.dataset,s=shift();if(d.field){let t=s.tasks.find(x=>x.id===d.id);t[d.field]=el.value;save()}else if(el.id==='technician'){s.technician=el.value;save()}else if(d.extnote!==undefined){s.external[+d.extnote].note=el.value;save()}});function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))}function validTask(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t.time)&& (t.time>='19:00'||t.time<='07:00')&&['normal','alta','critica'].includes(t.priority)&&['Rotina','Auditoria'].includes(t.category)&&typeof t.desc==='string'&&typeof t.role==='string'}function validStaff(a){return Array.isArray(a)&&a.length===roles.length&&a.every((x,i)=>x&&x.id==='role-'+i&&x.role===roles[i]&&typeof x.names==='string')}function validBackup(x){return x?.version===1&&Array.isArray(x.catalog)&&x.catalog.every(t=>validTask(t)&&typeof t.active==='boolean')&&validStaff(x.staffTemplate)&&['dark','light'].includes(x.theme)&&x.shifts&&typeof x.shifts==='object'&&Object.entries(x.shifts).every(([d,s])=>validDate(d)&&s.date===d&&Array.isArray(s.tasks)&&s.tasks.every(t=>validTask(t)&&Object.hasOwn(statusLabel,t.status)&&typeof t.note==='string'&&typeof t.executor==='string'&&(t.completed===null||!isNaN(Date.parse(t.completed)))&&Array.isArray(t.events)&&t.events.every(e=>typeof e.text==='string'&&!isNaN(Date.parse(e.at))))&&validStaff(s.staff)&&Array.isArray(s.external)&&s.external.length===2&&s.external.every(e=>typeof e.title==='string'&&typeof e.note==='string'&&['A confirmar','Confirmada','Repassada ao dia'].includes(e.status)&&(e.at===null||!isNaN(Date.parse(e.at))))&&Array.isArray(s.staffEvents)&&s.staffEvents.every(e=>typeof e.text==='string'&&!isNaN(Date.parse(e.at)))&&typeof s.technician==='string')}
document.addEventListener('change',async e=>{let el=e.target,d=el.dataset,s=shift();if(el.id==='date'&&validDate(el.value)){selected=el.value;render()}else if(d.staff!==undefined){let x=s.staff[+d.staff];if(x.names!==el.value){s.staffEvents.push({at:now(),text:x.role+': '+(x.names||'—')+' → '+el.value});x.names=el.value;save()}}else if(d.external!==undefined){let x=s.external[+d.external];x.status=el.value;x.at=now();save();render()}else if(el.id==='file'&&el.files[0]){try{let x=JSON.parse(await el.files[0].text());if(d.mode==='importStaff'){if(!validStaff(x.staff))throw Error('Escala inválida');if(!validDate(x.date))throw Error('Data inválida');if(!confirm('Salvar esta escala como modelo fixo e aplicar ao plantão selecionado ('+dateLabel(selected)+')? Os outros plantões serão preservados.'))return;let dest=shift();dest.staff=clone(x.staff);dest.staffEvents.push({at:now(),text:'Escala de referência importada como modelo fixo'});db.staffTemplate=clone(x.staff);tab='equipe'}else{if(!validBackup(x))throw Error('Backup inválido');if(!confirm('Substituir todos os registros locais pelo backup?'))return;db=x}save();render()}catch(err){alert('Importação não realizada: '+err.message)}finally{el.value=''}}});document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(!x.title.trim()||!(x.time>='19:00'||x.time<='07:00')){alert('Informe título e horário entre 19h e 07h.');return}let t=db.catalog.find(t=>t.id===x.id);if(t)Object.assign(t,x);else db.catalog.push({...x,id:uid(),active:true});save();render();alert('Catálogo atualizado para novos plantões.')});render();setInterval(updateCritical,1000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
