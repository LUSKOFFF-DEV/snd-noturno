name: Publish SND Noturno
on:
  push:
    branches: [main]
    paths:
      - 'modern/**'
      - 'index.html'
      - 'manifest.json'
      - 'icon*'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish
        required: true
        type: choice
        default: modern
        options:
          - modern
          - legacy
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_SND_CONNECTED_EXPERIMENT: 'false'
      VITE_SND_AUTH_URL: ''
      VITE_SND_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: github.event_name == 'push' || inputs.release == 'modern'
        working-directory: modern
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          node smoke.mjs
      - if: github.event_name == 'push' || inputs.release == 'modern'
        run: cp -R modern/dist site
      - if: github.event_name == 'workflow_dispatch' && inputs.release == 'legacy'
        run: |
          mkdir site
          cp index.html sw.js manifest.json icon.svg icon-192.png icon-512.png site/
      - run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
