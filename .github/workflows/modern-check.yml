name: Validate modern app
on:
  push:
    paths:
      - 'modern/**'
      - 'index.html'
      - '.github/workflows/modern-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: snd-noturno-modern
          path: modern/dist
